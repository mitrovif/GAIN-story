# Publishes the story to GitHub Pages on every push to main.
# Only the page and the files it loads go online; review/, pipeline/ and the full-size covers stay out.
name: Publish the story

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # only the original publishes; the EGRISS copy (egrisstats/GAIN-story) skips this
    if: github.repository == 'mitrovif/GAIN-story'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page and its files
        run: |
          mkdir -p _site/assets/fonts
          cp index.html Main.dc.html support.js _site/
          cp -r vendor _site/
          cp assets/*.json assets/*.png assets/*.jpg _site/assets/
          cp -r assets/covers-web _site/assets/
          cp -r assets/cases _site/assets/
          cp -r assets/recs _site/assets/
          cp assets/fonts/Obvia-SemiBold.otf _site/assets/fonts/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
