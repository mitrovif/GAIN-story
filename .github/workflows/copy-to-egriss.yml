# Keeps a copy of this repo at github.com/egriss/GAIN-story: every push to main is pushed there too.
# Needs a repository secret EGRISS_PUSH_TOKEN (a token that can push to egriss/GAIN-story).
# Until that secret exists the job does nothing and passes.
name: Copy to the egriss account

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to egriss/GAIN-story
        env:
          TOKEN: ${{ secrets.EGRISS_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "EGRISS_PUSH_TOKEN is not set yet; skipping the copy."
            exit 0
          fi
          git push "https://x-access-token:${TOKEN}@github.com/egriss/GAIN-story.git" HEAD:main
