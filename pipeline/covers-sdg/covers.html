<style>
:root{--navy:#14234c;--blue:#3b71b9;--line:#d9e2ef;--bg:#f7fafd;--soft:#5a6884;--faint:#8494a8}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:40px 22px 80px}
h1{font-family:"Figtree",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:2rem;margin:0 0 .1em}
.sub{color:var(--soft);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(19,32,48,.05),0 10px 26px rgba(19,32,48,.07);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(19,32,48,.14)}
.card a,.card .nolink{text-decoration:none;color:inherit;display:block}
.card img{width:100%;aspect-ratio:1/1.3;object-fit:cover;object-position:top;display:block;background:var(--line);border-bottom:1px solid var(--line)}
figcaption{padding:10px 12px;font-size:12.5px}
figcaption b{color:var(--blue)}
figcaption span{display:block;color:var(--navy);font-weight:600;margin:3px 0 2px;line-height:1.25}
figcaption em{display:block;color:var(--faint);font-style:normal;font-size:11px}
.nolink{opacity:.85}
</style></head><body><div class="wrap">
